# Extensión de compose.yaml: agrega la UI de presentación y laboratorio sin
# modificar el conjunto existente. Se usa junto con el archivo base:
#
#   docker compose -f compose.yaml -f compose.ui.yaml up --build -d
#
# Direcciones:
#   navegador → http://localhost:8088          (puerto publicado 8088)
#   contenedor arka-ui escucha en 8080          (puerto del contenedor)
#   proxy → http://servicio-solicitudes:8080    (nombre interno en la red de Compose)
#   proxy → http://servicio-notificaciones:8080
services:
  arka-ui:
    build: ./presentacion
    image: arka-ui:local
    ports: ["8088:8080"]
    environment:
      ARKA_SOLICITUDES_ORIGEN: http://servicio-solicitudes:8080
      ARKA_NOTIFICACIONES_ORIGEN: http://servicio-notificaciones:8080
    depends_on:
      servicio-solicitudes:
        condition: service_started
      servicio-notificaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/salud || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
