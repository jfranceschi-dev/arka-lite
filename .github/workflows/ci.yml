name: CI-Arkalitos

# define las acciones que ejecutan el pipeline
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  construir-probar-publicar:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ${{ matrix.base_datos }}
          POSTGRES_USER: arka
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arka -d ${{ matrix.base_datos }}"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/${{ matrix.base_datos }}
      DB_USER: arka
      DB_PASSWORD: ${{ github.run_id }}

    strategy:
      matrix:
        include:
          - servicio: servicio-solicitudes
            base_datos: db-solicitudes
          - servicio: servicio-notificaciones
            base_datos: db-notificaciones

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar java 26
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '26', cache: maven}

      - name: Compilar y Probar cada servicio
        run: mvn -B verify
        working-directory: ${{ matrix.servicio }}

      - name: Verificar arranque de solicitudes con PostgreSQL
        if: matrix.servicio == 'servicio-solicitudes'
        working-directory: ${{ matrix.servicio }}
        run: |
          java -jar target/servicio-solicitudes-*.jar > /tmp/solicitudes.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for intento in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/solicitudes | grep -q 'CAM-002'; then
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/solicitudes.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/solicitudes.log
          exit 1

      - name: login al registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        working-directory: ${{ matrix.servicio }}
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMG=ghcr.io/$REPO_NAME/${{ matrix.servicio }}:${{ github.sha }}
          docker build -t "$IMG" .
          docker push "$IMG"

  # UI de presentación y laboratorio (presentacion/). Valida la fuente de
  # contenido, prueba, construye, genera y verifica los PPTX y comprueba que
  # Compose acepta la extensión. Publica la imagen solo en push a main.
  presentacion:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    defaults:
      run:
        working-directory: presentacion

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: presentacion/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Validar contenido y tipos
        run: |
          npm run validar
          npm run typecheck

      - name: Probar la UI
        run: npm test

      - name: Construir la UI
        run: npm run build

      - name: Generar y verificar PPTX
        run: |
          npm run pptx
          npm run verificar-pptx

      - name: Validar la extension de Compose
        working-directory: .
        run: docker compose -f compose.yaml -f compose.ui.yaml config --quiet

      - name: Construir la imagen de la UI
        run: docker build -t arka-ui:ci .

      - name: login al registro
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar la imagen de la UI
        if: github.event_name == 'push'
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMG=ghcr.io/$REPO_NAME/arka-ui:${{ github.sha }}
          docker tag arka-ui:ci "$IMG"
          docker push "$IMG"
