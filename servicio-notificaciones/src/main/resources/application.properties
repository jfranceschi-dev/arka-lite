spring.application.name=servicio-notificaciones
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/db-notificaciones}
spring.datasource.username=${DB_USER:arka}
spring.datasource.password=${DB_PASSWORD:arka}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.schema-locations=classpath:schema.notificaciones.sql

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

logging.structured.format.console=ecs

management.tracing.sampling.probability=1.0