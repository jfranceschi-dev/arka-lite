services:
  db-solicitudes:
    image: postgres:17
    environment:
      POSTGRES_DB: db-solicitudes
      POSTGRES_USER: arka
      POSTGRES_PASSWORD: arka
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arka -d db-solicitudes"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-notificaciones:
    image: postgres:17
    ports: ["5433:5432"]
    environment:
      POSTGRES_DB: db-notificaciones
      POSTGRES_USER: arka
      POSTGRES_PASSWORD: arka
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arka -d db-notificaciones"]
      interval: 5s
      timeout: 3s
      retries: 5

  servicio-notificaciones:
    build: ./servicio-notificaciones
    ports: ["${NOTIFICACIONES_PORT:-18081}:8080"]
    environment:
      DB_URL: jdbc:postgresql://db-notificaciones:5432/db-notificaciones
      DB_USER: arka
      DB_PASSWORD: arka
    depends_on:
      db-notificaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 5

  servicio-solicitudes:
    build: ./servicio-solicitudes
    ports: ["${SOLICITUDES_PORT:-18080}:8080"]
    environment:
      NOTIFICACIONES_URL: "http://servicio-notificaciones:8080/eventos/solicitud-enviada"
      DB_URL: jdbc:postgresql://db-solicitudes:5432/db-solicitudes
      DB_USER: arka
      DB_PASSWORD: arka
    depends_on:
      servicio-notificaciones:
        condition: service_healthy
      db-solicitudes:
        condition: service_healthy

  arka-lite-ui:                     # la interfaz web: http://localhost:8088
    build: ./arka-lite-ui
    ports: ["8088:8080"]
    environment:
      # nginx reenvía /api a cada servicio por su nombre en la red de Compose.
      ARKA_SOLICITUDES_ORIGEN: http://servicio-solicitudes:8080
      ARKA_NOTIFICACIONES_ORIGEN: http://servicio-notificaciones:8080
      # Enlaces que abre el navegador (puertos publicados en este archivo).
      ARKA_ENLACE_SWAGGER_SOLICITUDES: http://localhost:${SOLICITUDES_PORT:-18080}/swagger-ui/index.html
      ARKA_ENLACE_SWAGGER_NOTIFICACIONES: http://localhost:${NOTIFICACIONES_PORT:-18081}/swagger-ui/index.html
      ARKA_ENLACE_GRAFANA: http://localhost:3000
    depends_on:
      servicio-solicitudes:
        condition: service_started
      servicio-notificaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/salud || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  loki:                             # almacén + consulta de logs (la "sala de control")
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["3100:3100"]

  promtail:                         # recolecta los logs de TODOS los contenedores y los manda a Loki
    image: grafana/promtail:3.0.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ./observabilidad/promtail.yaml
        target: /etc/promtail/config.yaml
        read_only: true
        bind:
          create_host_path: false
    command: -config.file=/etc/promtail/config.yaml
    depends_on: [loki]

  grafana:                          # el TABLERO: en 'Explore' se buscan las trazas por traceId
    image: grafana/grafana:11.0.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    depends_on: [loki]
