services:
  base-datos:
    image: postgres:17
    environment:
      POSTGRES_DB: arka
      POSTGRES_USER: arka
      POSTGRES_PASSWORD: arka
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arka"]
      interval: 5s
      timeout: 3s
      retries: 5

  servicio-notificaciones:
    build: ./servicio-notificaciones
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 5

  servicio-solicitudes:
    build: ./servicio-solicitudes
    ports: ["8080:8080"]
    environment:
      NOTIFICACIONES_URL: "http://servicio-notificaciones:8080/eventos/solicitud-enviada"
      DB_URL: jdbc:postgresql://base-datos:5432/arka
      DB_USER: arka
      DB_PASSWORD: arka
    depends_on:
      servicio-notificaciones:
        condition: service_healthy
      base-datos:
        condition: service_healthy