# UI de ARKA-Lite (arka-lite-ui). Se aplica junto con el
# resto de manifiestos:
#
#   bash construir.sh            # construye también arka-lite-ui:local
#   kubectl apply -f k8s/
#   kubectl port-forward svc/arka-lite-ui 8088:8080   → http://localhost:8088
#
# nginx resuelve los nombres de los Services al arrancar. El initContainer
# espera a que ambos servicios respondan, como hace servicio-solicitudes con
# notificaciones, para que el orden de aplicación no importe.
#
# El navegador solo usa /api del mismo origen. Los nombres internos del
# clúster viven en este ConfigMap y los usa únicamente nginx.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arka-lite-ui-rutas
data:
  ARKA_SOLICITUDES_ORIGEN: http://servicio-solicitudes:8080
  ARKA_NOTIFICACIONES_ORIGEN: http://servicio-notificaciones:8080
  # Enlaces para el navegador. En el clúster local se llega por port-forward:
  #   kubectl port-forward svc/servicio-solicitudes 8080:8080
  #   kubectl port-forward svc/servicio-notificaciones 8081:8080
  ARKA_ENLACE_SWAGGER_SOLICITUDES: http://localhost:8080/swagger-ui/index.html
  ARKA_ENLACE_SWAGGER_NOTIFICACIONES: http://localhost:8081/swagger-ui/index.html
  ARKA_ENLACE_GRAFANA: http://localhost:3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arka-lite-ui
spec:
  replicas: 1
  selector:
    matchLabels: { app: arka-lite-ui }
  template:
    metadata:
      labels: { app: arka-lite-ui }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      initContainers:
        - name: esperar-servicios
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -q -T 2 -O /dev/null http://servicio-solicitudes:8080/actuator/health && wget -q -T 2 -O /dev/null http://servicio-notificaciones:8080/actuator/health; do echo esperando servicios; sleep 2; done']
      containers:
        - name: arka-lite-ui
          image: arka-lite-ui:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: arka-lite-ui-rutas
          readinessProbe:
            httpGet: { path: /salud, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /salud, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: arka-lite-ui
spec:
  type: ClusterIP
  selector: { app: arka-lite-ui }
  ports:
    - port: 8080
      targetPort: http
