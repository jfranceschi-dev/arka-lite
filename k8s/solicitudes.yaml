apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-solicitudes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servicio-solicitudes
  template:
    metadata:
      labels:
        app: servicio-solicitudes
    spec:
      initContainers:
        - name: esperar-notificaciones
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -q -O /dev/null http://servicio-notificaciones:8080/notificaciones; do echo esperando notificaciones; sleep 2; done']
      containers:
        - name: servicio-solicitudes
          image: servicio-solicitudes:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: NOTIFICACIONES_URL
              value: "http://servicio-notificaciones:8080/eventos/solicitud-enviada"
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-solicitudes
spec:
  type: NodePort
  selector:
    app: servicio-solicitudes
  ports:
    - port: 8080
      targetPort: 8080