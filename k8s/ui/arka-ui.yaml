# UI de presentación y laboratorio. Está en una subcarpeta para que
# `kubectl apply -f k8s/` (no recursivo) siga aplicando solo los servicios.
#
#   docker build -t arka-ui:local presentacion
#   kubectl apply -f k8s/
#   kubectl apply -f k8s/ui/
#   kubectl port-forward svc/arka-ui 8088:8080   → http://localhost:8088
#
# El navegador solo usa /api del mismo origen. Los nombres internos del
# clúster viven en este ConfigMap y los usa únicamente nginx.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arka-ui-rutas
data:
  ARKA_SOLICITUDES_ORIGEN: http://servicio-solicitudes:8080
  ARKA_NOTIFICACIONES_ORIGEN: http://servicio-notificaciones:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arka-ui
spec:
  replicas: 1
  selector:
    matchLabels: { app: arka-ui }
  template:
    metadata:
      labels: { app: arka-ui }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: arka-ui
          image: arka-ui:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: arka-ui-rutas
          readinessProbe:
            httpGet: { path: /salud, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /salud, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: arka-ui
spec:
  type: ClusterIP
  selector: { app: arka-ui }
  ports:
    - port: 8080
      targetPort: http
