spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db-solicitudes}
spring.datasource.username=${DB_USER:arka}
spring.datasource.password=${DB_PASSWORD:arka}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=always

spring.application.name=servicio-solicitudes
notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8081/eventos/solicitud-enviada}

#actuador : exponer salud y metricas
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always


#logs estructurados en JSON (Spring Boot nativo) : cada log es un objeto con campos
logging.structured.format.console=ecs
#trazavbilidad : muestrear el 100% en desarrollo (en prod se baja   )
management.tracing.sampling.probability=1.0

